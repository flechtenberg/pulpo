[build-system]
requires = ["setuptools>=65.5", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulpo-dev"
version = "1.6.1"
description = "Pulpo package for optimization in LCI databases"
authors = [
  { name="Fabian Lechtenberg", email="fabian.lechtenberg@chem.ethz.ch" }
]
maintainers = [
  { name="Fabian Lechtenberg", email="fabian.lechtenberg@chem.ethz.ch" }
]
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
    "fs==2.4.16",
    # 6.7.3 still touches np.float_ under numpy 2; 6.8.0 is the first
    # release verified against numpy 2 + highspy 1.15.
    "pyomo>=6.8.0,<7.0.0",
    "highspy==1.15.1",
    "ipython==8.14.0",
    "jupyterlab",
    "numpy<3.0.0",
    "pandas",
    "scipy<=1.14.1",
    "tqdm",
    "joblib",
    "xlsxwriter",
    "openpyxl",
    "pypardiso>=0.4.7; sys_platform != 'darwin'",
]

[project.optional-dependencies]
bw2 = [
    "bw2calc<=1.8.2",
    "bw2data<4.0.0",
    # Legacy Brightway2 (bw2data 3.x) uses np.NaN at runtime, which was
    # removed in numpy 2.0; it also caps the usable Python at 3.12.
    "numpy<2.0.0",
]
bw25 = [
    "bw2calc>=2.0.0",
    "bw2data>=4.0.0"
]
uncertainty = [
    "stats_arrays==0.7.0",
    "SALib==1.4.8",
    "seaborn==0.13.2",
    "matplotlib==3.10.7",
    "typing_extensions==4.15.0"
]

[project.urls]
homepage = "https://github.com/flechtenberg/pulpo"
repository = "https://github.com/flechtenberg/pulpo"

[tool.setuptools.packages.find]
include = ["pulpo*"]

[tool.uv]
conflicts = [
    [
        { extra = "bw2" },
        { extra = "bw25" },
    ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flake8]
max_line_length = 88
exclude = [
    ".tox",
    "build",
    "dist",
    ".eggs"
]
